name: Hydration

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    APP_GROUP_IDENTIFIER: group.com.example.Hydration
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: targeted

packages:
  HydrationKit:
    path: HydrationKit

targets:

  Hydration:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
        excludes: ["Tests/**", "UITests/**", "Info.plist", "*.entitlements"]
      - Shared
    dependencies:
      - package: HydrationKit
        product: HydrationDomain
      - package: HydrationKit
        product: HydrationPersistence
      - package: HydrationKit
        product: HydrationDesignSystem
      - package: HydrationKit
        product: HydrationRouting
      - package: HydrationKit
        product: HydrationPairedDevice
      - target: HydrationWidget
      - target: HydrationWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    entitlements:
      path: Apps/iOS/Hydration.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Apps/iOS/Info.plist
      properties:
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.example.Hydration
            CFBundleURLSchemes: [hydration]

  HydrationWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/Watch
        excludes: ["Tests/**", "Info.plist", "*.entitlements"]
      - Shared
    dependencies:
      - package: HydrationKit
        product: HydrationDomain
      - package: HydrationKit
        product: HydrationPersistence
      - package: HydrationKit
        product: HydrationDesignSystem
      - package: HydrationKit
        product: HydrationPairedDevice
    entitlements:
      path: Apps/Watch/HydrationWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Apps/Watch/Info.plist
      properties:
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.Hydration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Hydration.watchkitapp

  HydrationWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Widget
        excludes: ["Tests/**", "Info.plist", "*.entitlements"]
      - Shared
    dependencies:
      - package: HydrationKit
        product: HydrationDomain
      - package: HydrationKit
        product: HydrationPersistence
      - package: HydrationKit
        product: HydrationDesignSystem
      - package: HydrationKit
        product: HydrationRouting
    entitlements:
      path: Apps/Widget/HydrationWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Apps/Widget/Info.plist
      properties:
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Hydration.widget

  HydrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Apps/iOS/Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hydration
      - package: HydrationKit
        product: HydrationDesignSystem
      - package: HydrationKit
        product: HydrationTestSupport

  HydrationWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - Apps/Watch/Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HydrationWatch
      - package: HydrationKit
        product: HydrationDesignSystem
      - package: HydrationKit
        product: HydrationTestSupport

  HydrationWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Apps/Widget/Tests
      - path: Apps/Widget/Features/Today
        excludes: ["HydrationWidget.swift", "AddDrinkIntent.swift"]
      - Shared/Formatting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hydration
      - package: HydrationKit
        product: HydrationDesignSystem
      - package: HydrationKit
        product: HydrationTestSupport

  HydrationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Apps/iOS/UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hydration

schemes:
  Hydration:
    build:
      targets:
        Hydration: all
    test:
      gatherCoverageData: true
      coverageTargets: [Hydration]
      targets:
        - HydrationTests
        - HydrationWidgetTests
        - HydrationUITests
        - package: HydrationKit/HydrationDomainTests
        - package: HydrationKit/HydrationPersistenceTests
    run:
      config: Debug

  HydrationWatch:
    build:
      targets:
        HydrationWatch: all
    test:
      targets: [HydrationWatchTests]
    run:
      config: Debug
